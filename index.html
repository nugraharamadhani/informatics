  { q: "Simbol flowchart yang berbentuk jajar genjang (parallelogram) digunakan untuk menyatakan ....",
    o: ["Titik awal dan titik akhir program", "Proses input/output data", "Keputusan bercabang", "Perhitungan matematika"], a: 1 },
  { q: "Simbol flowchart berbentuk belah ketupat (diamond) digunakan untuk menyatakan ....",
    o: ["Awal dan akhir program", "Proses perhitungan", "Keputusan (decision) yang memiliki dua jalur", "Konektor antarhalaman"], a: 2 },
  { q: "Dalam pseudocode, struktur perulangan yang digunakan ketika jumlah iterasi belum diketahui secara pasti adalah ....",
    o: ["FOR", "WHILE", "IF", "CASE"], a: 1 },
  { q: "Jejak digital (digital footprint) yang ditinggalkan pengguna internet saat memposting sesuatu bersifat ....",
    o: ["Sementara dan hilang dalam hitungan menit", "Permanen dan sulit dihapus sepenuhnya dari internet", "Hanya dapat dilihat oleh pengguna sendiri", "Otomatis terhapus setelah 24 jam"], a: 1 }
];

/* ============================================================
   STATE
============================================================ */
let paketDipilih = null;
let soalAktif = [];
let jawabanSiswa = [];
let sedangUjian = false;

/* ============================================================
   PILIH PAKET
============================================================ */
function pilihPaket(p) {
  paketDipilih = p;
  document.getElementById('cardA').classList.toggle('selected', p === 'A');
  document.getElementById('cardB').classList.toggle('selected', p === 'B');
}

/* ============================================================
   MULAI UJIAN
============================================================ */
function mulaiUjian() {
  if (!paketDipilih) {
    alert('⚠️ Silakan pilih Paket Soal A atau B terlebih dahulu!');
    return;
  }
  const nama = document.getElementById('nama').value.trim();
  const kelas = document.getElementById('kelas').value.trim();
  const absen = document.getElementById('absen').value.trim();

  if (!nama || !kelas || !absen) {
    alert('⚠️ Silakan isi Nama, Kelas, dan Nomor Absen terlebih dahulu!');
    return;
  }

  window.dataSiswa = { nama, kelas, absen, paket: paketDipilih };
  soalAktif = (paketDipilih === 'A') ? paketA : paketB;
  jawabanSiswa = new Array(soalAktif.length).fill(null);
  sedangUjian = true;

  document.getElementById('paketForm').style.display = 'none';
  document.getElementById('soalContainer').style.display = 'block';
  document.getElementById('hasil').style.display = 'none';
  document.getElementById('badgePaket').textContent = 'PAKET ' + paketDipilih;

  renderSoal();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSoal() {
  const container = document.getElementById('daftarSoal');
  container.innerHTML = '';

  soalAktif.forEach((soal, i) => {
    const div = document.createElement('div');
    div.className = 'soal';
    div.id = 'soal-' + i;

    let opsiHtml = '';
    soal.o.forEach((opsi, j) => {
      opsiHtml += `
        <label class="opsi" id="opsi-${i}-${j}">
          <input type="radio" name="soal-${i}" value="${j}" onchange="pilihJawaban(${i}, ${j})">
          <b>${String.fromCharCode(65 + j)}.</b> ${opsi}
        </label>`;
    });

    div.innerHTML = `
      <div class="pertanyaan"><span class="nomor">${i + 1}</span>${soal.q}</div>
      ${opsiHtml}
    `;
    container.appendChild(div);
  });

  updateProgress();
}

function pilihJawaban(soalIndex, opsiIndex) {
  if (!sedangUjian) return;
  jawabanSiswa[soalIndex] = opsiIndex;
  const soalDiv = document.getElementById('soal-' + soalIndex);
  soalDiv.querySelectorAll('.opsi').forEach(el => el.classList.remove('selected'));
  document.getElementById('opsi-' + soalIndex + '-' + opsiIndex).classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const terjawab = jawabanSiswa.filter(j => j !== null).length;
  document.getElementById('progressInfo').textContent =
    `Terjawab: ${terjawab} / ${soalAktif.length} soal`;
}

/* ============================================================
   SELESAI UJIAN
============================================================ */
function selesaiUjian() {
  const terjawab = jawabanSiswa.filter(j => j !== null).length;
  if (terjawab < soalAktif.length) {
    const yakin = confirm(`Masih ada ${soalAktif.length - terjawab} soal yang belum dijawab.\nYakin ingin menyelesaikan?`);
    if (!yakin) return;
  }

  sedangUjian = false;
  let benar = 0;

  soalAktif.forEach((soal, i) => {
    const soalDiv = document.getElementById('soal-' + i);
    const jawabanUser = jawabanSiswa[i];
    soalDiv.querySelectorAll('.opsi').forEach(el => el.classList.remove('selected'));

    if (jawabanUser !== null && jawabanUser === soal.a) {
      benar++;
      soalDiv.classList.add('correct');
    } else {
      soalDiv.classList.add('wrong');
    }

    const kunciDiv = document.createElement('div');
    kunciDiv.className = 'kunci';
    kunciDiv.style.display = 'block';
    kunciDiv.innerHTML = '✔️ Kunci: <b>' + String.fromCharCode(65 + soal.a) + '.</b> ' + soal.o[soal.a];
    soalDiv.appendChild(kunciDiv);
  });

  const nilai = Math.round((benar / soalAktif.length) * 100);

  document.getElementById('soalContainer').style.display = 'none';
  document.getElementById('hasil').style.display = 'block';

  document.getElementById('infoSiswa').innerHTML =
    `<strong>${window.dataSiswa.nama}</strong> — Kelas ${window.dataSiswa.kelas} — No. Absen ${window.dataSiswa.absen}<br>
     <span style="font-size:13px;">Paket ${window.dataSiswa.paket}</span>`;
  document.getElementById('nilai').textContent = nilai;

  let pesan = '';
  if (nilai >= 90) pesan = '🌟 Luar biasa! Pertahankan!';
  else if (nilai >= 75) pesan = '👍 Bagus! Tingkatkan lagi.';
  else if (nilai >= 60) pesan = '📖 Cukup. Perbanyak latihan.';
  else pesan = '💪 Jangan menyerah, terus belajar!';
  document.getElementById('pesan').textContent = pesan + ` (Benar ${benar} dari ${soalAktif.length})`;

  document.getElementById('hasil').scrollIntoView({ behavior: 'smooth' });
}

/* ============================================================
   ULANGI
============================================================ */
function ulangUjian() {
  document.getElementById('nama').value = '';
  document.getElementById('kelas').value = '';
  document.getElementById('absen').value = '';
  document.getElementById('cardA').classList.remove('selected');
  document.getElementById('cardB').classList.remove('selected');
  paketDipilih = null;

  document.getElementById('hasil').style.display = 'none';
  document.getElementById('soalContainer').style.display = 'none';
  document.getElementById('paketForm').style.display = 'block';

  document.getElementById('daftarSoal').innerHTML = '';
  document.getElementById('progressInfo').textContent = '';
  jawabanSiswa = [];
  sedangUjian = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
